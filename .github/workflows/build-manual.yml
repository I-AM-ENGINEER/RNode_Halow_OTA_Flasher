name: Build desktop app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Application version (for example: 1.4.0 or 1.4.0-beta1)"
        required: true
        type: string
      python_version:
        description: "Python version for the build"
        required: false
        default: "3.13"
        type: string

permissions:
  contents: write

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Normalize version
        id: vars
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          VERSION="${{ steps.vars.outputs.version }}"
          TITLE="RNode-HaLow Flasher v${VERSION}"
          NOTES="Automated pre-release build for ${TITLE}."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TITLE" \
              --prerelease \
              --notes "$NOTES"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --prerelease \
              --latest=false \
              --notes "$NOTES"
          fi

  build:
    needs: prepare_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_name: linux
          - runner: windows-latest
            os_name: windows

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Inject application version
        run: python tools/set_version.py "${{ needs.prepare_release.outputs.version }}"

      - name: Build on Linux
        if: runner.os == 'Linux'
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Build on Windows
        if: runner.os == 'Windows'
        run: build_win.bat
        shell: cmd

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release
          tar -C dist -czf "release/RNode-HaLow-Flasher-${{ needs.prepare_release.outputs.version }}-linux.tar.gz" .

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $asset = "release/RNode-HaLow-Flasher-${{ needs.prepare_release.outputs.version }}-windows.zip"
          if (Test-Path $asset) { Remove-Item $asset -Force }
          Compress-Archive -Path "dist\*" -DestinationPath $asset -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: RNode-HaLow-Flasher-${{ needs.prepare_release.outputs.version }}-${{ matrix.os_name }}
          path: release/*
          if-no-files-found: error

      - name: Upload prerelease asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ needs.prepare_release.outputs.tag }}" release/* --clobber
