name: Build desktop app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Application version (for example: 1.4.0 or 1.4.0-beta1)"
        required: true
        type: string
      python_version:
        description: "Python version for the build"
        required: false
        default: "3.13"
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_name: linux
          - runner: windows-latest
            os_name: windows

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Inject application version
        run: python tools/set_version.py "${{ inputs.version }}"

      - name: Build on Linux
        if: runner.os == 'Linux'
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Build on Windows
        if: runner.os == 'Windows'
        run: build_win.bat
        shell: cmd

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RNode-HaLow-Flasher-${{ inputs.version }}-${{ matrix.os_name }}
          path: |
            dist/**
          if-no-files-found: error
