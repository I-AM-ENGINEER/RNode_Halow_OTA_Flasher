name: Build desktop app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Application version (for example: 1.4.0 or 1.4.0-beta1)"
        required: true
        type: string
      python_version:
        description: "Python version for the Windows build"
        required: false
        default: "3.13"
        type: string

permissions:
  contents: write

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Normalize version
        id: vars
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          VERSION="${{ steps.vars.outputs.version }}"
          TITLE="RNode-HaLow Flasher v${VERSION}"
          NOTES="Automated pre-release build for ${TITLE}."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TITLE" \
              --prerelease \
              --notes "$NOTES"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --prerelease \
              --latest=false \
              --notes "$NOTES"
          fi

  build:
    needs: prepare_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: linux
          - os_name: windows

    runs-on: ${{ matrix.os_name == 'linux' && 'ubuntu-latest' || 'windows-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ==================================================================
      # Linux: build inside a Debian 11 (bullseye) container so the
      # resulting binary is linked against glibc 2.31. This makes it run
      # on every modern desktop distro (Debian 11+, Ubuntu 21+, Fedora
      # 33+, Mint 20.3+, Arch, ...). The job itself stays on the hosted
      # ubuntu-latest runner, so checkout + gh work normally.
      # ==================================================================
      - name: Build on Linux (Debian 11 / glibc 2.31)
        if: matrix.os_name == 'linux'
        env:
          VERSION: ${{ needs.prepare_release.outputs.version }}
        run: |
          docker run --rm -v "$PWD":/src -w /src -e VERSION="$VERSION" debian:bullseye-slim bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive

            echo "[*] Installing build deps (python3 + tk/tcl + X11)..."
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates \
              binutils \
              libpython3.9 \
              python3 python3-venv python3-pip python3-tk \
              libtcl8.6 libtk8.6 \
              libx11-6 libxft2 libxss1 libxrender1 libxext6 \
              libxi6 libxrandr2 libxcursor1 libxinerama1 libxfixes3 \
              libglib2.0-0 libfontconfig1 libfreetype6 libpng16-16

            echo "[*] Injecting application version..."
            python3 tools/set_version.py "$VERSION"

            echo "[*] Building..."
            chmod +x build_linux.sh
            ./build_linux.sh
          '

      - name: Fix ownership of build outputs
        if: matrix.os_name == 'linux'
        run: sudo chown -R "$(id -u):$(id -g)" dist build .venv || true

      # ==================================================================
      # Windows: unchanged, uses the hosted windows-latest runner.
      # ==================================================================
      - name: Set up Python
        if: matrix.os_name == 'windows'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip

      - name: Install Python dependencies (Windows)
        if: matrix.os_name == 'windows'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Inject application version (Windows)
        if: matrix.os_name == 'windows'
        run: python tools/set_version.py "${{ needs.prepare_release.outputs.version }}"

      - name: Build on Windows
        if: matrix.os_name == 'windows'
        run: build_win.bat
        shell: cmd

      - name: Package Linux artifact
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          mkdir -p release
          tar -C dist -czf "release/RNode-HaLow-Flasher-${{ needs.prepare_release.outputs.version }}-linux.tar.gz" .

      - name: Package Windows artifact
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $asset = "release/RNode-HaLow-Flasher-${{ needs.prepare_release.outputs.version }}-windows.zip"
          if (Test-Path $asset) { Remove-Item $asset -Force }
          Compress-Archive -Path "dist\*" -DestinationPath $asset -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: RNode-HaLow-Flasher-${{ needs.prepare_release.outputs.version }}-${{ matrix.os_name }}
          path: release/*
          if-no-files-found: error

      - name: Upload prerelease asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ needs.prepare_release.outputs.tag }}" release/* --clobber
